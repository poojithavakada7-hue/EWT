<!DOCTYPE html>
<html>
<head>
    <title>Coding Courses</title>
    <style>
        body {
    font-family: Arial;
    background-color: #f5f5f5;
    text-align: center;
}
h1 {
    margin-top: 50px;
}
.intro {
    color: gray;
}
.courses {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-top: 40px;
}
.card {
    width: 250px;
    padding: 30px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 4px 10px gray;
}
button {
    padding: 10px 25px;
    background-color: #222;
    color: white;
    border: none;
    border-radius: 5px;
}
    </style>
</head>
<body>
    <h1>🧑‍💻 Learn Coding</h1>
    <p class="intro">Choose a course and start learning.</p>
    <div class="courses">
        <div class="card">
            <h2>Python</h2>
            <p>Learn Python from basics.</p>
            <button>Enroll</button>
        </div>
        <div class="card">
            <h2>Java</h2>
            <p>Learn Java programming.</p>
            <button>Enroll</button>
        </div>
        <div class="card">
            <h2>Web Development</h2>
            <p>Learn HTML and CSS.</p>
            <button>Enroll</button>
        </div>
    </div>
</body>
</html>
