<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h1>Website Feedback</h1>
    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>
        <label>Email:</label>
        <input type="email">
        <br><br>
        <label>Rating:</label>
        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>
        <label>Comments:</label><br>
        <textarea rows="5" cols="30"></textarea>
        <br><br>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
